name: Sync Catálogo Maquiagem

on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sync (MakiMakes)
        env:
          WHATSAPP: '5562991134488'
          BRAND_NAME: 'Empório A.R. Beauty'
        run: node scripts/sync-catalog.mjs

      - name: Publicar catalogo.json no Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          if [ -z "$GIST_TOKEN" ] || [ -z "$GIST_ID" ]; then
            echo "Configure os secrets GIST_TOKEN e GIST_ID no repositório."
            exit 1
          fi
          if [ ! -f catalogo.generated.json ]; then
            echo "catalogo.generated.json não encontrado"
            exit 1
          fi
          curl -sS -X PATCH \
            -H "Authorization: Bearer $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/$GIST_ID" \
            -d "{\"files\":{\"catalogo.json\":{\"content\":$(python3 -c 'import json,sys; print(json.dumps(open("catalogo.generated.json").read()))')}}}" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print("Gist:", d.get("html_url","erro")); print("ok" if d.get("files") else d)'
