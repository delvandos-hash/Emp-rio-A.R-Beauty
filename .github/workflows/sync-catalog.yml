name: Sync Catálogo Maquiagem

on:
  schedule:
    # 2x ao dia (UTC) ≈ 08h e 20h Brasília
    - cron: '0 11 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:   # permite rodar manualmente

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sync (MakiMakes)
        env:
          WHATSAPP: '5562991134488'
          BRAND_NAME: 'Empório A.R. Beauty'
          # MAX_PRODUCTS: '50'   # descomente só para teste
        run: node scripts/sync-catalog.mjs

      - name: Atualizar catalogo.json
        run: |
          if [ -f catalogo.generated.json ]; then
            cp catalogo.generated.json catalogo.json
            echo "catalogo.json atualizado"
          else
            echo "Nenhum arquivo gerado"
            exit 1
          fi

      - name: Commit e push (se houver mudanças)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalogo.json catalogo.generated.json
          if git diff --staged --quiet; then
            echo "Nenhuma alteração no catálogo"
          else
            git commit -m "chore: sync catálogo MakiMakes $(date -u +%Y-%m-%d)"
            git push
          fi
