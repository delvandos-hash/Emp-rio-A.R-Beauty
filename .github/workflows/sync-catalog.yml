name: Sync Catálogo Maquiagem

on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sync (MakiMakes)
        env:
          WHATSAPP: '5562991134488'
          BRAND_NAME: 'Empório A.R. Beauty'
        run: node scripts/sync-catalog.mjs

      - name: Publicar catalogo.json no Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          set -e
          if [ -z "$GIST_TOKEN" ] || [ -z "$GIST_ID" ]; then
            echo "Configure os secrets GIST_TOKEN e GIST_ID."
            exit 1
          fi
          if [ ! -f catalogo.generated.json ]; then
            echo "catalogo.generated.json não encontrado"
            exit 1
          fi

          # Monta o body em arquivo (evita "Argument list too long")
          python3 << 'PY'
          import json
          content = open("catalogo.generated.json", "r", encoding="utf-8").read()
          payload = {"files": {"catalogo.json": {"content": content}}}
          with open("gist-payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          print("payload bytes:", len(json.dumps(payload)))
          PY

          curl -sS -X PATCH \
            -H "Authorization: Bearer ${GIST_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary @gist-payload.json \
            "https://api.github.com/gists/${GIST_ID}" \
            -o gist-response.json \
            -w "HTTP %{http_code}\n"

          python3 << 'PY'
          import json
          d = json.load(open("gist-response.json", encoding="utf-8"))
          if "files" in d:
              f = d["files"].get("catalogo.json") or list(d["files"].values())[0]
              print("Gist OK:", d.get("html_url"))
              print("Arquivo:", f.get("filename"), "size:", f.get("size"))
          else:
              print("Falha ao atualizar Gist:")
              print(json.dumps(d, indent=2)[:1500])
              raise SystemExit(1)
          PY
