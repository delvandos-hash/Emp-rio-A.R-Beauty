[build]
  publish = "."
  command = "echo static+functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Prévia social dinâmica: injeta título, descrição e foto do produto para crawlers.
[[edge_functions]]
  function = "product-share"
  path = "/p/*"

# Links curtos de produtos: a aplicação resolve /p/<slug> sem expor IDs longos.
[[redirects]]
  from = "/p/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/feed.xml"
  to = "/.netlify/functions/feed"
  status = 200
  force = true

[[redirects]]
  from = "/catalogo.generated.json"
  to = "/.netlify/functions/blocked"
  status = 404
  force = true

[[redirects]]
  from = "/data/*"
  to = "/.netlify/functions/blocked"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' https://makimakes.jetassets.com.br https://via.placeholder.com data: blob:; connect-src 'self' https://gist.githubusercontent.com https://raw.githubusercontent.com https://emporioar-beauty.netlify.app https://makimakes.jetassets.com.br https://viacep.com.br; script-src 'self' blob: https://plausible.io; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/catalogo.json"
  [headers.values]
    Cache-Control = "public, max-age=120"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"
