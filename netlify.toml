[build]
  publish = "."
  functions = "netlify/functions"
  # Pula o build se a mudança for só catálogo / data / workflows (economiza crédito)
  # exit 0 = cancela build | exit != 0 = executa build
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!catalogo.json' ':!catalogo.generated.json' ':!data/**' ':!.github/**' ':!README.md' ':!*.md'"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/catalogo.json"
  [headers.values]
    Cache-Control = "public, max-age=120"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
