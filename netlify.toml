[build]
  publish = "."
  # Sem build command — site estático puro

[[redirects]]
  from = "/feed.xml"
  to = "/.netlify/functions/feed"
  status = 200
  force = true

# Se precisar de proxy para estoque ao vivo no futuro:
# [[redirects]]
#   from = "/api/estoque/*"
#   to = "https://fornecedor.com/..."
#   status = 200
#   force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
